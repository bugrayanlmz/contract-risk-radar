[project]
name = "contract-risk-radar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0,<3", "alembic>=1.14,<2",
  "psycopg[binary,pool]>=3.2,<4", "procrastinate>=3.5,<4",
  "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20,<1",
  "email-validator>=2.2,<3", "argon2-cffi>=23,<26",
  "PyJWT>=2.10,<3", "httpx>=0.28,<1", "pypdf>=5,<7"
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "reportlab>=4,<5", "aiosqlite>=0.21,<1", "pymupdf>=1.25,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["postgres: requires TEST_DATABASE_URL pointing at a disposable PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests", "evals"]
