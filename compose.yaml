name: contract-risk-radar

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://radar:radar@db:5432/radar
    SAMPLES_DIR: /workspace/samples

services:
  db:
    image: postgres:17-bookworm
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
      POSTGRES_DB: radar
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    command: ["python", "-m", "scripts.migrate"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    ports: ["8000:8000"]
    volumes:
      - ./backend/app:/workspace/backend/app
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    <<: *backend
    command: ["python", "-m", "app.jobs.worker"]
    volumes:
      - ./backend/app:/workspace/backend/app
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_PROXY_TARGET: http://api:8000
    ports: ["5173:5173"]
    volumes:
      - ./frontend/src:/workspace/frontend/src
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
